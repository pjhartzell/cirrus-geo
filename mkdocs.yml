site_name: Cirrus
site_url: https://cirrus-geo.github.io/cirrus-geo/
site_description: >-
  Cirrus is a STAC-based geospatial processing pipeline platform deployed on AWS.
repo_url: https://github.com/cirrus-geo/cirrus-geo
repo_name: cirrus-geo/cirrus-geo
edit_uri: edit/main/docs/src/

docs_dir: docs/src

validation:
  links:
    anchors: warn

site_dir: docs/build/site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

plugins:
  - search
  - mermaid2
  - mike
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            # docstring defects are tracked in DOCSTRING_GAPS.md for a
            # follow-up code PR; re-enable parser warnings when fixed
            docstring_options:
              warnings: false
            members_order: source
            filters: ["!^_"]
            show_if_no_docstring: true
            show_root_heading: true
            show_source: false
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            heading_level: 2

extra:
  version:
    provider: mike

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - mkdocs-click
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom

nav:
  - Home: index.md
  - Getting started:
      - What is Cirrus: getting-started/intro.md
      - Concepts & architecture: getting-started/architecture.md
      - Quickstart: getting-started/quickstart.md
      - Follow a payload through Cirrus: getting-started/follow-a-payload.md
  - Building pipelines:
      - Workflows: building-pipelines/workflows.md
      - Chaining workflows: building-pipelines/chaining-workflows.md
      - Tasks: building-pipelines/tasks.md
      - Batch:
          - Batch workflow structure: building-pipelines/batch-workflow-structure.md
          - Batch infrastructure: building-pipelines/batch-infrastructure.md
      - Feeders: building-pipelines/feeders.md
  - Deploying & operating:
      - Deployment: operating/deployment.md
      - Monitoring & troubleshooting: operating/monitoring.md
      - Upgrading to 2.0: operating/upgrading.md
  - Reference:
      - Payload schema: reference/payload-schema.md
      - State database: reference/state-database.md
      - Payload bucket: reference/payload-bucket.md
      - HTTP API: reference/http-api.md
      - Lambda functions: reference/lambda-functions.md
      - CLI:
          - Using the CLI: cli/using-the-cli.md
          - Command reference: cli/reference.md
          - Common CLI workflows: cli/common-workflows.md
      - Library API:
          - CirrusPayload: api/cirrus_payload.md
          - StateDB: api/statedb.md
          - PayloadBucket: api/payload_bucket.md
          - Events: api/events.md
          - Errors and exceptions: api/errors.md
          - Deployment class: api/deployment.md
  - About:
      - Contributing: about/contributing.md
      - Changelog: about/changelog.md
      - License: about/license.md
