site_name: Cirrus
site_url: https://cirrus-geo.github.io/cirrus-geo/
site_description: >-
  Cirrus is a STAC-based geospatial processing pipeline platform deployed on AWS.
repo_url: https://github.com/cirrus-geo/cirrus-geo
repo_name: cirrus-geo/cirrus-geo
edit_uri: edit/main/docs/src/

docs_dir: docs/src
site_dir: docs/build/site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

plugins:
  - search
  - mermaid2
  - mike

extra:
  version:
    provider: mike

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom

# Quickstart and Upgrading-to-2.0 pages are authored in Session 2 of the
# docs overhaul (see docs/DOCS_PLAN.md).
nav:
  - Home: index.md
  - Getting Started:
      - What is Cirrus: cirrus/10_intro.md
      - Concepts & architecture: cirrus/20_arch.md
  - Guides:
      - Payloads: cirrus/30_payload.md
      - Workflows:
          - Overview: cirrus/components/workflows/index.md
          - Workflow definitions: cirrus/components/workflows/definitions.md
          - Chaining workflows: cirrus/components/workflows/chaining.md
          - Batch in workflows: cirrus/components/workflows/batch.md
      - Batch tasks: cirrus/components/tasks/batch.md
      - Configuration and deployment: cirrus/40_config-deploy.md
      - Operations: cirrus/50_operation.md
      - Monitoring: cirrus/80_monitoring.md
      - Tips and tricks: cirrus/95_tips_and_tricks.md
  - Reference:
      - Components:
          - Overview: cirrus/60_components.md
          - Feeders: cirrus/components/feeders/index.md
          - Functions:
              - Overview: cirrus/components/functions/index.md
              - api: components/functions/api.md
              - process: components/functions/process.md
              - update-state: components/functions/update-state.md
              - pre-batch: components/functions/pre_batch.md
              - post-batch: components/functions/post_batch.md
          - Tasks: cirrus/components/tasks/index.md
      - CLI:
          - Overview: cli/00_intro.md
          - Installing: cli/01_install.md
          - Authentication: cli/02_auth.md
          - Deployments: cli/03_deployments.md
          - Command examples: cli/04_commands.md
      - State database: cirrus/70_statedb.md
      - Payload bucket: cirrus/75_payload_bucket.md
  - About:
      - Contributing: about/contributing.md
      - Changelog: about/changelog.md
      - License: about/license.md
