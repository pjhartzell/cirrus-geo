site_name: Cirrus
site_url: https://cirrus-geo.github.io/cirrus-geo/
site_description: >-
  Cirrus is a STAC-based geospatial processing pipeline platform deployed on AWS.
repo_url: https://github.com/cirrus-geo/cirrus-geo
repo_name: cirrus-geo/cirrus-geo
edit_uri: edit/main/docs/src/

docs_dir: docs/src
site_dir: docs/build/site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

plugins:
  - search
  - mermaid2
  - mike
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            # docstring defects are tracked in DOCSTRING_GAPS.md for a
            # follow-up code PR; re-enable parser warnings when fixed
            docstring_options:
              warnings: false
            members_order: source
            filters: ["!^_"]
            show_if_no_docstring: true
            show_root_heading: true
            show_source: false
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            heading_level: 2

extra:
  version:
    provider: mike

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - mkdocs-click
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom

nav:
  - Home: index.md
  - Getting Started:
      - What is Cirrus: cirrus/10_intro.md
      - Quickstart: cirrus/15_quickstart.md
      - End-to-end walkthrough: cirrus/17_end_to_end.md
      - Concepts & architecture: cirrus/20_arch.md
  - Guides:
      - Payloads: cirrus/30_payload.md
      - Workflows:
          - Workflows: components/workflows/definitions.md
          - Chaining workflows: components/workflows/chaining.md
          - Batch in workflows: components/workflows/batch.md
      - Batch tasks: components/tasks/batch.md
      - Deployment: cirrus/40_config-deploy.md
      - Monitoring: cirrus/80_monitoring.md
      - Upgrading to 2.0: cirrus/85_upgrading.md
  - Reference:
      - Components:
          - Feeders: components/feeders/index.md
          - Lambda functions: components/functions/index.md
          - Tasks: components/tasks/index.md
      - CLI:
          - Using the CLI: cli/using-the-cli.md
          - CLI reference: cli/reference.md
          - Common CLI workflows: cli/04_commands.md
      - Library API:
          - CirrusPayload: api/cirrus_payload.md
          - StateDB: api/statedb.md
          - PayloadBucket: api/payload_bucket.md
          - Events: api/events.md
          - Errors and exceptions: api/errors.md
          - Deployment class: api/deployment.md
      - State database: cirrus/70_statedb.md
      - Payload bucket: cirrus/75_payload_bucket.md
      - Cirrus API endpoints: cirrus/78_api_endpoints.md
  - About:
      - Contributing: about/contributing.md
      - Changelog: about/changelog.md
      - License: about/license.md
